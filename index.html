  <title>DataMaq | Automatización Industrial</title>
  <script>
    // --- DataMaq Unified Debug Gateway (Chatwoot Edition) ---
    (function () {
      console.log('%c🚀 [DataMaq] Debug Gateway Active', 'color: #ff6a00; font-weight: bold; background: #1a1a1a; padding: 2px 5px; border-radius: 3px;');

      // --- Chatwoot Standalone Loader for SPA ---
      const CW_BASE_URL = "https://chatwoot.datamaq.com.ar";
      const CW_TOKEN = "EaFpQ65unLmqzYshTRLS8R2E";

      (function(d,t) {
        console.log('📡 [DataMaq] Injecting Chatwoot SDK into SPA...');
        var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
        g.src=CW_BASE_URL+"/packs/js/sdk.js";
        g.async = true;
        s.parentNode.insertBefore(g,s);
        g.onload=function(){
          console.log('✅ [DataMaq] Chatwoot SDK Script loaded in SPA.');
          window.chatwootSDK.run({
            websiteToken: CW_TOKEN,
            baseUrl: CW_BASE_URL
          });
        }
      })(document,"script");
      // ------------------------------------------

      // 1. Interceptar Fetch
      const originalFetch = window.fetch;
      window.fetch = function () {
        let [resource, config] = arguments;

        // Proxy para API de DataMaq (PHP/REST)
        if (typeof resource === 'string' && resource.includes('api.datamaq.com.ar')) {
          resource = resource.replace('https://api.datamaq.com.ar', '/index.php?rest_route=');
        }

        // Intercepción de Leads (Unificada hacia Chatwoot vía WP)
        if (typeof resource === 'string' && resource.includes('/datamaq/v1/lead')) {
          const traceId = 'cw-' + Math.random().toString(36).substr(2, 9);
          const startTime = performance.now();
          
          console.groupCollapsed(`📬 [DataMaq] Lead Capture -> Chatwoot [${traceId}]`);
          console.log('🔗 Source URL:', resource);
          
          // Forzamos la ruta al puente de WordPress que ahora usa ChatWootLeadRepository
          resource = '/index.php?rest_route=/datamaq/v1/lead';

          config.headers = {
            ...config.headers,
            'X-DataMaq-Trace-ID': traceId,
            'X-DataMaq-Source': 'Unified-Gateway'
          };

          return originalFetch.apply(this, [resource, config]).then(async (response) => {
            const clone = response.clone();
            const duration = (performance.now() - startTime).toFixed(2);
            try {
              const data = await clone.json();
              console.log(`✅ [${duration}ms] Response:`, data);
            } catch (e) {
              console.warn(`⚠️ [${duration}ms] Could not parse response JSON`);
            }
            console.groupEnd();
            return response;
          }).catch(err => {
            console.error('❌ Lead Sync Error:', err);
            console.groupEnd();
            throw err;
          });
        }

        return originalFetch.apply(this, [resource, config]);
      };

      // 2. Función Unificada para abrir el chat
      let pendingChatOpen = false;
      const openChat = function (source = 'direct') {
        console.log(`%c💬 [DataMaq] Attempting to open Chatwoot [Source: ${source}]...`, 'color: #00A8E8; font-weight: bold;');
        
        if (window.$chatwoot) {
          console.log('%c✅ [DataMaq] $chatwoot found. Toggling widget...', 'color: #4CAF50;');
          window.$chatwoot.toggle();
          return true;
        }

        if (window.chatwootSDK) {
          console.warn('⚠️ [DataMaq] Chatwoot SDK exists but $chatwoot is not yet initialized. Flagging for auto-open.');
          pendingChatOpen = true;
          return false;
        }

        console.error('❌ [DataMaq] Chatwoot SDK NOT found in window. It might be blocked or still loading.');
        pendingChatOpen = true;
        return false;
      };

      // Listener para cuando el widget esté listo
      window.addEventListener('chatwoot:ready', () => {
        console.log('%c✨ [DataMaq] Chatwoot Event: READY received', 'color: #00ff90; font-weight: bold;');
        if (pendingChatOpen) {
          console.log('🚀 [DataMaq] Executing pending chat open request...');
          if (window.$chatwoot) window.$chatwoot.toggle();
          pendingChatOpen = false;
        }
      });

      // 3. Interceptar window.open (WhatsApp)
      const originalOpen = window.open;
      window.open = function (url, target, features) {
        if (typeof url === 'string' && (url.includes('wa.me') || url.includes('whatsapp.com'))) {
          console.info('%c🛑 [DataMaq] WhatsApp window.open intercepted. Diverting to Chatwoot.', 'background: #25D366; color: white; padding: 2px 5px;');
          openChat('window.open');
          return null;
        }
        return originalOpen.apply(this, arguments);
      };

      // 4. Interceptar clics (Captura)
      document.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link && (link.href.includes('wa.me') || link.href.includes('whatsapp.com') || link.getAttribute('href') === '#chat')) {
          console.info('%c🛑 [DataMaq] Interaction intercepted. Opening Chatwoot.', 'background: #00A8E8; color: white; padding: 2px 5px;');
          e.preventDefault();
          e.stopPropagation();
          openChat('click-interceptor');
        }
      }, true);

      window.addEventListener('load', () => {
        console.log('🏁 [DataMaq] Window Load complete. Running UI cleanup...');
        // Modificar la UI de la SPA (Eliminar rastros de WhatsApp viejo)
        const cleanupUI = () => {
          const oldElements = document.querySelectorAll('.c-whatsapp-fab, .c-contact-page-footer__whatsapp, .c-home-footer__whatsapp');
          oldElements.forEach(el => {
            if (el.dataset.cleaned) return;
            console.log('🧹 [DataMaq] Removing legacy WhatsApp element:', el.className);
            el.dataset.cleaned = "true";
            el.remove();
          });

          // Hack para el Dock de la SPA
          const dockEmergencyLink = document.querySelector('.c-home-dock__link--emergency');
          if (dockEmergencyLink && !dockEmergencyLink.dataset.chatHijacked) {
             console.log('⚓ [DataMaq] Hijacking SPA Dock "Contact" link...');
             dockEmergencyLink.dataset.chatHijacked = "true";
             dockEmergencyLink.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                openChat('spa-dock');
             }, true);
             dockEmergencyLink.innerHTML = '<i class="bi bi-chat-dots-fill" aria-hidden="true" style="font-size: 1.3rem; margin-bottom: 2px;"></i><span>Asistente</span>';
          }
        };
        cleanupUI();

        const observer = new MutationObserver((mutations) => {
          cleanupUI();
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>
