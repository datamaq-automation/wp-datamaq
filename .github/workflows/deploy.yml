name: CD - Pipeline Completo

on:
  push:
    branches: [ main ]

jobs:
  # JOB 1: Validación de Calidad (CI en la nube para seguridad extra)
  validate:
    name: "🔍 Validar Calidad (L1-L4)"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl
        coverage: none

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: "L1-L4: Full Validation"
      run: |
        echo "::group::L1: PHP Syntax Check"
        find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
        echo "::endgroup::"
        
        echo "::group::L2: WordPress Coding Standards (PHPCS)"
        ./vendor/bin/phpcs --standard=phpcs.xml -n
        echo "::endgroup::"
        
        echo "::group::L3: Static Analysis (PHPStan)"
        ./vendor/bin/phpstan analyze -c phpstan.neon --no-progress
        echo "::endgroup::"
        
        echo "::group::L4: Unit Tests (PHPUnit)"
        ./vendor/bin/phpunit --display-warnings
        echo "::endgroup::"

  # JOB 2: Despliegue a Producción (Solo si el Job 1 pasa)
  deploy:
    name: "🚀 Desplegar a Producción"
    needs: validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: "🚀 Deploy via SSH/Rsync"
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        REMOTE_HOST: ${{ vars.REMOTE_HOST }}
        REMOTE_USER: ${{ vars.REMOTE_USER }}
        REMOTE_PORT: ${{ vars.REMOTE_PORT }}
        TARGET: ${{ vars.REMOTE_TARGET }}
        ARGS: "-avz --delete"
        EXCLUDE: "/.git/, /.github/, /node_modules/, /tests/, /phpunit.xml, /phpstan.neon, /phpcs.xml"

    - name: "🧹 Post-Deploy: Cache Flush & Audit"
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.REMOTE_HOST }}
        username: ${{ vars.REMOTE_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ vars.REMOTE_PORT }}
        script: |
          cd ${{ vars.REMOTE_TARGET }}
          if command -v wp &> /dev/null; then
            wp cache flush --allow-root
            echo "✅ WordPress Cache Flushed"
          fi
          echo '{"commit": "${{ github.sha }}", "date": "$(date -u)"}' > deploy-info.json

    - name: "🏥 Health Check (Smoke Test)"
      run: |
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.SITE_URL }})
        if [ "$RESPONSE" -eq 200 ]; then
          echo "✅ Site is UP (HTTP 200)"
        else
          echo "❌ Site is DOWN (HTTP $RESPONSE)"
          exit 1
        fi
