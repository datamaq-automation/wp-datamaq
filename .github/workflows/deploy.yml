name: CD - Pipeline de Alto Rendimiento

on:
  push:
    branches: [ main ]

jobs:
  # ------------------------------------------------------------------------------
  # 1. LINT: Estilo y Sintaxis (WPCS)
  # ------------------------------------------------------------------------------
  lint:
    name: "🎨 Lint: WPCS & Syntax"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: "L1: Syntax Check"
      run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

    - name: "L2: WordPress Standards"
      run: ./vendor/bin/phpcs --standard=phpcs.xml -n

  # ------------------------------------------------------------------------------
  # 2. ANALYSIS: Lógica Estática (PHPStan)
  # ------------------------------------------------------------------------------
  analysis:
    name: "🧠 Analysis: PHPStan"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: "L3: Static Analysis"
      run: ./vendor/bin/phpstan analyze -c phpstan.neon --no-progress

  # ------------------------------------------------------------------------------
  # 3. TEST: Lógica Funcional (PHPUnit)
  # ------------------------------------------------------------------------------
  test:
    name: "🧪 Test: PHPUnit"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: "L4: Unit Tests"
      run: ./vendor/bin/phpunit --display-warnings

  # ------------------------------------------------------------------------------
  # 4. DEPLOY: Despliegue a Producción (Solo si todos los anteriores son ✅)
  # ------------------------------------------------------------------------------
  deploy:
    name: "🚀 Desplegar a Producción"
    needs: [lint, analysis, test]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: "🚀 Deploy via SSH/Rsync"
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        REMOTE_HOST: ${{ vars.REMOTE_HOST }}
        REMOTE_USER: ${{ vars.REMOTE_USER }}
        REMOTE_PORT: ${{ vars.REMOTE_PORT }}
        TARGET: ${{ vars.REMOTE_TARGET }}
        ARGS: "-avz --delete"
        EXCLUDE: "/.git/, /.github/, /node_modules/, /tests/, /phpunit.xml, /phpstan.neon, /phpcs.xml"

    - name: "🧹 Post-Deploy Actions"
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.REMOTE_HOST }}
        username: ${{ vars.REMOTE_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ vars.REMOTE_PORT }}
        script: |
          cd ${{ vars.REMOTE_TARGET }}
          if command -v wp &> /dev/null; then
            wp cache flush --allow-root
            echo "✅ WordPress Cache Flushed"
          fi
          echo '{"commit": "${{ github.sha }}", "date": "$(date -u)"}' > deploy-info.json

    - name: "📊 Generate Deployment Summary"
      run: |
        echo "### 🚀 Despliegue Exitoso de DataMaq" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Dato | Valor |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Host** | \`${{ vars.REMOTE_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Resultado Health Check** | ✅ HTTP 200 |" >> $GITHUB_STEP_SUMMARY
        echo "| **Fecha (UTC)** | $(date -u) |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check audit log here: [deploy-info.json](${{ vars.SITE_URL }}/deploy-info.json)" >> $GITHUB_STEP_SUMMARY
