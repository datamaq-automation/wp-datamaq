name: CD - Pipeline de Despliegue

on:
  push:
    branches: [ main ]

jobs:
  # ------------------------------------------------------------------------------
  # 1. AUDIT SECRETS: Validar claves de seguridad
  # ------------------------------------------------------------------------------
  audit_secrets:
    name: "🔐 Audit: Secrets"
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "Validar Clave SSH"
      env:
        SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      run: |
        if [[ -z "$SSH_KEY" ]]; then
          echo "::error title=Secret Missing::La clave SERVER_SSH_KEY no está cargada."
          exit 1
        fi

  # ------------------------------------------------------------------------------
  # 2. AUDIT VARIABLES: Validar configuración de entorno
  # ------------------------------------------------------------------------------
  audit_variables:
    name: "📋 Audit: Variables"
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "Validar Variables de Entorno"
      run: |
        MISSING=()
        [[ -z "${{ vars.REMOTE_HOST }}" ]] && MISSING+=("REMOTE_HOST")
        [[ -z "${{ vars.REMOTE_USER }}" ]] && MISSING+=("REMOTE_USER")
        [[ -z "${{ vars.REMOTE_TARGET }}" ]] && MISSING+=("REMOTE_TARGET")
        
        if [ ${#MISSING[@]} -ne 0 ]; then
          echo "::error title=Vars Missing::Faltan: ${MISSING[*]}"
          exit 1
        fi

  # ------------------------------------------------------------------------------
  # 3. HOST DETECTION: ¿Es IP o Dominio?
  # ------------------------------------------------------------------------------
  host_type:
    name: "🔍 Audit: Host Type"
    needs: audit_variables
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      type: ${{ steps.detect.outputs.type }}
    steps:
    - id: detect
      run: |
        HOST="${{ vars.REMOTE_HOST }}"
        if [[ "$HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "type=ip" >> $GITHUB_OUTPUT
          echo "::notice title=Host Type::Se detectó una IP directa."
        else
          echo "type=domain" >> $GITHUB_OUTPUT
          echo "::notice title=Host Type::Se detectó un nombre de dominio."
        fi

  # ------------------------------------------------------------------------------
  # 4. DNS SYNTAX: Validar formato del nombre
  # ------------------------------------------------------------------------------
  dns_syntax:
    name: "🌐 Audit: DNS Syntax"
    needs: host_type
    if: needs.host_type.outputs.type == 'domain'
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "Validar Formato"
      run: |
        HOST="${{ vars.REMOTE_HOST }}"
        if [[ "$HOST" =~ ^([a-zA-Z0-9](([a-zA-Z0-9-]*[a-zA-Z0-9])?)\.)+[a-zA-Z]{2,}$ ]]; then
          echo "✅ Formato de dominio válido."
        else
          echo "::error title=Syntax Error::El host '$HOST' no tiene un formato de dominio válido (ej. sub.dominio.com)."
          exit 1
        fi

  # ------------------------------------------------------------------------------
  # 5. DNS RESOLUTION: Solo si es dominio y la sintaxis es correcta
  # ------------------------------------------------------------------------------
  dns_resolution:
    name: "🌐 Audit: DNS Resolution"
    needs: dns_syntax
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "Lookup & Diagnosis"
      run: |
        HOST="${{ vars.REMOTE_HOST }}"
        echo "🔍 Intentando resolver: $HOST"
        if ! nslookup "$HOST"; then
          echo "::error title=DNS NXDOMAIN::El dominio '$HOST' no pudo ser resuelto."
          echo "--- INFO DE DEPURACIÓN ---"
          echo "1. Verifica que el registro A esté creado en Cloudflare/DNS."
          echo "2. Si usas Cloudflare, asegúrate de que esté en modo 'DNS Only' (nube gris)."
          echo "3. TIP: Puedes usar la IP directa provisionalmente."
          exit 1
        fi

  # ------------------------------------------------------------------------------
  # 6. SSH CHECK: ¿El servidor acepta la conexión?
  # ------------------------------------------------------------------------------
  ssh_check:
    name: "🔑 Audit: SSH Auth"
    needs: [host_type, dns_resolution]
    if: always() && (needs.host_type.result == 'success') && (needs.dns_resolution.result == 'success' || needs.dns_resolution.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "Prueba de Conexión"
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.REMOTE_HOST }}
        username: ${{ vars.REMOTE_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ vars.REMOTE_PORT || '22' }}
        script: echo "✅ Conexión establecida con éxito."

  # ------------------------------------------------------------------------------
  # 7. DEPLOY: Sincronización de archivos
  # ------------------------------------------------------------------------------
  deploy:
    name: "🚀 Sincronizar Archivos"
    needs: ssh_check
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: "🚀 Deploy via SSH/Rsync"
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        REMOTE_HOST: ${{ vars.REMOTE_HOST }}
        REMOTE_USER: ${{ vars.REMOTE_USER }}
        REMOTE_PORT: ${{ vars.REMOTE_PORT || '22' }}
        TARGET: ${{ vars.REMOTE_TARGET }}
        ARGS: "-avz --delete"
        EXCLUDE: "/.git/, /.github/, /node_modules/, /tests/, /phpunit.xml, /phpstan.neon, /phpcs.xml"

  # ------------------------------------------------------------------------------
  # 8. VERIFY: Post-despliegue y Salud
  # ------------------------------------------------------------------------------
  verify:
    name: "🏥 Verificar Salud"
    needs: deploy
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "🧹 Post-Deploy & Summary"
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.REMOTE_HOST }}
        username: ${{ vars.REMOTE_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ vars.REMOTE_PORT || '22' }}
        script: |
          cd ${{ vars.REMOTE_TARGET }}
          if command -v wp &> /dev/null; then
            wp cache flush --allow-root
            echo "✅ WordPress Cache Flushed"
          fi
          echo '{"commit": "${{ github.sha }}", "date": "$(date -u)"}' > deploy-info.json

    - name: "🏥 Smoke Test"
      run: |
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.SITE_URL }})
        if [ "$RESPONSE" -eq 200 ]; then
          echo "✅ Site is UP"
        else
          echo "::error title=Site Down::El sitio respondió con HTTP $RESPONSE"
          exit 1
        fi

    - name: "📊 Ultimate Summary"
      run: |
        echo "### 🚀 Reporte de Despliegue DataMaq" >> $GITHUB_STEP_SUMMARY
        echo "| Etapa | Resultado |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔐 Seguridad | ✅ OK |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔍 Tipo Host | ${{ needs.host_type.outputs.type }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🌐 DNS Syntax | ✅ OK |" >> $GITHUB_STEP_SUMMARY
        echo "| 🌐 DNS Res | ${{ needs.dns_resolution.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔑 SSH Auth | ✅ OK |" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Sync | ✅ OK |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏥 Salud | ✅ OK |" >> $GITHUB_STEP_SUMMARY
