name: CD - Pipeline de Despliegue

on:
  push:
    branches: [ main ]

jobs:
  # ------------------------------------------------------------------------------
  # 1. AUDIT SECRETS: Validar claves de seguridad
  # ------------------------------------------------------------------------------
  audit_secrets:
    name: "🔐 Audit: Secrets"
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "Validar Clave SSH"
      env:
        SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      run: |
        if [[ -z "$SSH_KEY" ]]; then
          echo "::error title=Secret Missing::La clave SERVER_SSH_KEY no está cargada."
          exit 1
        fi

  # ------------------------------------------------------------------------------
  # 2. AUDIT VARIABLES: Validar configuración de entorno
  # ------------------------------------------------------------------------------
  audit_variables:
    name: "📋 Audit: Variables"
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "Validar Variables de Entorno"
      run: |
        MISSING=()
        [[ -z "${{ vars.REMOTE_HOST }}" ]] && MISSING+=("REMOTE_HOST")
        [[ -z "${{ vars.REMOTE_USER }}" ]] && MISSING+=("REMOTE_USER")
        [[ -z "${{ vars.REMOTE_TARGET }}" ]] && MISSING+=("REMOTE_TARGET")
        
        if [ ${#MISSING[@]} -ne 0 ]; then
          echo "::error title=Vars Missing::Faltan: ${MISSING[*]}"
          exit 1
        fi

  # ------------------------------------------------------------------------------
  # 3. DNS CHECK: ¿El dominio es válido?
  # ------------------------------------------------------------------------------
  dns_check:
    name: "🌐 Audit: DNS Resolution"
    needs: audit_variables
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "Verificar Resolución"
      run: |
        echo "🔍 Intentando resolver: ${{ vars.REMOTE_HOST }}"
        if getent hosts ${{ vars.REMOTE_HOST }} > /dev/null; then
          IP=$(getent hosts ${{ vars.REMOTE_HOST }} | awk '{print $1}')
          echo "✅ Host resuelto a la IP: $IP"
        else
          echo "::error title=DNS Error::No se puede resolver '${{ vars.REMOTE_HOST }}'. Tip: Usa la IP directa si el DNS no está listo."
          exit 1
        fi

  # ------------------------------------------------------------------------------
  # 4. SSH CHECK: ¿El servidor acepta la conexión?
  # ------------------------------------------------------------------------------
  ssh_check:
    name: "🔑 Audit: SSH Auth"
    needs: dns_check
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "Prueba de Conexión"
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.REMOTE_HOST }}
        username: ${{ vars.REMOTE_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ vars.REMOTE_PORT || '22' }}
        script: echo "✅ SSH Handshake exitoso con usuario ${{ vars.REMOTE_USER }}"

  # ------------------------------------------------------------------------------
  # 5. DEPLOY: Sincronización de archivos
  # ------------------------------------------------------------------------------
  deploy:
    name: "🚀 Sincronizar Archivos"
    needs: ssh_check
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: "🚀 Deploy via SSH/Rsync"
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        REMOTE_HOST: ${{ vars.REMOTE_HOST }}
        REMOTE_USER: ${{ vars.REMOTE_USER }}
        REMOTE_PORT: ${{ vars.REMOTE_PORT || '22' }}
        TARGET: ${{ vars.REMOTE_TARGET }}
        ARGS: "-avz --delete"
        EXCLUDE: "/.git/, /.github/, /node_modules/, /tests/, /phpunit.xml, /phpstan.neon, /phpcs.xml"

  # ------------------------------------------------------------------------------
  # 6. VERIFY: Post-despliegue y Salud
  # ------------------------------------------------------------------------------
  verify:
    name: "🏥 Verificar Salud"
    needs: deploy
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: "🧹 Post-Deploy & Summary"
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.REMOTE_HOST }}
        username: ${{ vars.REMOTE_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ vars.REMOTE_PORT || '22' }}
        script: |
          cd ${{ vars.REMOTE_TARGET }}
          if command -v wp &> /dev/null; then
            wp cache flush --allow-root
            echo "✅ WordPress Cache Flushed"
          fi
          echo '{"commit": "${{ github.sha }}", "date": "$(date -u)"}' > deploy-info.json

    - name: "🏥 Smoke Test"
      run: |
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.SITE_URL }})
        if [ "$RESPONSE" -eq 200 ]; then
          echo "✅ Site is UP"
        else
          echo "::error title=Site Down::El sitio respondió con HTTP $RESPONSE"
          exit 1
        fi

    - name: "📊 Summary Report"
      run: |
        echo "### 🚀 Reporte de Despliegue DataMaq" >> $GITHUB_STEP_SUMMARY
        echo "| Etapa | Estatus | Detalle |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔐 Seguridad | ✅ OK | Claves validadas |" >> $GITHUB_STEP_SUMMARY
        echo "| 🌐 Red (DNS) | ✅ OK | Host resuelto |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔑 Acceso SSH | ✅ OK | Autenticación exitosa |" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Despliegue | ✅ OK | Archivos sincronizados |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏥 Salud Final | ✅ OK | HTTP 200 |" >> $GITHUB_STEP_SUMMARY
