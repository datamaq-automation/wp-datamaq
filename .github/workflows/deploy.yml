name: CD - Pipeline de Despliegue

on:
  push:
    branches: [ main ]

jobs:
  # ------------------------------------------------------------------------------
  # 1. AUDIT SECRETS: Validar claves de seguridad
  # ------------------------------------------------------------------------------
  audit_secrets:
    name: "🔐 Audit: Secrets"
    runs-on: ubuntu-latest
    steps:
    - name: "Validar Clave SSH"
      run: |
        if [[ -z "${{ secrets.SERVER_SSH_KEY }}" ]]; then
          echo "::error::❌ La clave SERVER_SSH_KEY no está cargada en Secrets."
          exit 1
        else
          echo "✅ Secretos validados."
        fi

  # ------------------------------------------------------------------------------
  # 2. AUDIT VARIABLES: Validar configuración de entorno
  # ------------------------------------------------------------------------------
  audit_variables:
    name: "📋 Audit: Variables"
    runs-on: ubuntu-latest
    steps:
    - name: "Validar Variables de Entorno"
      run: |
        MISSING=()
        [[ -z "${{ vars.REMOTE_HOST }}" ]] && MISSING+=("REMOTE_HOST")
        [[ -z "${{ vars.REMOTE_USER }}" ]] && MISSING+=("REMOTE_USER")
        [[ -z "${{ vars.REMOTE_TARGET }}" ]] && MISSING+=("REMOTE_TARGET")
        [[ -z "${{ vars.SITE_URL }}" ]] && MISSING+=("SITE_URL")
        
        if [ ${#MISSING[@]} -ne 0 ]; then
          echo "::error::❌ Faltan configurar las siguientes Variables: ${MISSING[*]}"
          exit 1
        else
          echo "✅ Variables validadas."
        fi

  # ------------------------------------------------------------------------------
  # 3. DEPLOY: Sincronización de archivos (Solo si 1 y 2 son ✅)
  # ------------------------------------------------------------------------------
  deploy:
    name: "🚀 Sincronizar Archivos"
    needs: [audit_secrets, audit_variables]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: "🚀 Deploy via SSH/Rsync"
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        REMOTE_HOST: ${{ vars.REMOTE_HOST }}
        REMOTE_USER: ${{ vars.REMOTE_USER }}
        REMOTE_PORT: ${{ vars.REMOTE_PORT || '22' }}
        TARGET: ${{ vars.REMOTE_TARGET }}
        ARGS: "-avz --delete"
        EXCLUDE: "/.git/, /.github/, /node_modules/, /tests/, /phpunit.xml, /phpstan.neon, /phpcs.xml"

  # ------------------------------------------------------------------------------
  # 4. VERIFY: Post-despliegue y Salud
  # ------------------------------------------------------------------------------
  verify:
    name: "🏥 Verificar Salud"
    needs: deploy
    runs-on: ubuntu-latest
    steps:
    - name: "🧹 Post-Deploy: Cache Flush & Audit"
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.REMOTE_HOST }}
        username: ${{ vars.REMOTE_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ vars.REMOTE_PORT || '22' }}
        script: |
          cd ${{ vars.REMOTE_TARGET }}
          if command -v wp &> /dev/null; then
            wp cache flush --allow-root
            echo "✅ WordPress Cache Flushed"
          fi
          echo '{"commit": "${{ github.sha }}", "date": "$(date -u)"}' > deploy-info.json

    - name: "🏥 Health Check (Smoke Test)"
      run: |
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.SITE_URL }})
        if [ "$RESPONSE" -eq 200 ]; then
          echo "✅ Site is UP (HTTP 200)"
        else
          echo "❌ Site is DOWN (HTTP $RESPONSE)"
          exit 1
        fi

    - name: "📊 Summary"
      run: |
        echo "### 🚀 Despliegue Exitoso" >> $GITHUB_STEP_SUMMARY
        echo "| Etapa | Resultado |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Secrets** | ✅ Validados |" >> $GITHUB_STEP_SUMMARY
        echo "| **Variables** | ✅ Validadas |" >> $GITHUB_STEP_SUMMARY
        echo "| **Sincronización** | ✅ Completada |" >> $GITHUB_STEP_SUMMARY
        echo "| **Salud del Sitio** | ✅ HTTP 200 |" >> $GITHUB_STEP_SUMMARY
